name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      # After ruff, which would lint the checkout: tests/test_bundled_extensions.py loads its items.
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - run: uv run python -m unittest discover -s tests
        env:
          MARKETPLACE_CHECKOUT: ${{ github.workspace }}/marketplace
  marketplace:
    # The default marketplace's items against this minimal: an API change that would break a published
    # item fails here, before a release ships it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv pip install -r marketplace/requirements-ci.txt
      - run: uv run minimal ext check marketplace
