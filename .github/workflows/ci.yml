name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra tui
      - run: uv run ruff check
      - run: uv run mypy
      # After ruff, which would lint the checkout: tests/test_bundled_extensions.py loads its items.
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - run: uv run coverage run -m unittest discover -s tests
        env:
          MARKETPLACE_CHECKOUT: ${{ github.workspace }}/marketplace
      - run: uv run coverage report
  marketplace:
    # The default marketplace's items against this minimal: an API change that would break a published
    # item fails here, before a release ships it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra tui
      - run: uv run minimal ext check --install-deps marketplace
  no-tui:
    # Without the tui extra: the core and the console frontend must import and run without Textual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -c "import importlib.util, sys, minimal.api, minimal.ui.frontends; sys.exit(importlib.util.find_spec('textual') is not None)"
      - run: uv run python -m unittest tests.test_frontends
