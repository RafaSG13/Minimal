name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    # The full OS x Python matrix, lint, types and the marketplace check: a release is irreversible.
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Tag matches minimal.__version__
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import minimal; print(minimal.__version__)')"
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - name: The default marketplace's items still load on this minimal
        run: uv run minimal ext check --install-deps marketplace
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  homebrew:
    # Points the Homebrew formula (RafaSG13/homebrew-tap) at the release just published. Skipped, not failed, while
    # the HOMEBREW_TAP_TOKEN secret (fine-grained, contents:write on RafaSG13/homebrew-tap) does not exist: PyPI is
    # already published by then, and `scripts/update_brew_formula.py` does the same by hand (RELEASING.md).
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: RafaSG13/homebrew-tap
          path: tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
      - if: env.HOMEBREW_TAP_TOKEN != ''
        run: python3 scripts/update_brew_formula.py "${GITHUB_REF_NAME#v}" tap/Formula/minimal.rb
      - if: env.HOMEBREW_TAP_TOKEN != ''
        working-directory: tap
        run: |
          git diff --quiet || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "minimal ${GITHUB_REF_NAME#v}"
            git push
          }
