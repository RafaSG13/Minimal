name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Tag matches minimal.__version__
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import minimal; print(minimal.__version__)')"
      - uses: actions/checkout@v7
        with:
          repository: RafaSG13/minimal-marketplace
          path: marketplace
          persist-credentials: false
      - name: The default marketplace's items still load on this minimal
        run: uv run --extra tui minimal ext check --install-deps marketplace
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
