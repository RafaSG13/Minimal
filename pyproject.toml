[project]
name = "minimal"
version = "0.1.0"
description = "Minimal, extensible coding-agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "RafaSG13", email = "rafasrrg13@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "google-genai>=2.34.0",
    "openai>=3.49.0",
    "questionary>=2",
    "textual>=8.2",
]

[project.scripts]
minimal = "minimal.cli:main"

[dependency-groups]
dev = ["ruff>=0.15", "pillow>=10"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rule set that was ruff's default at 0.15; newer releases enable many more by default.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
