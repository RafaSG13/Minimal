[project]
name = "mnml-agent"
dynamic = ["version"]
description = "Minimal, extensible coding-agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "RafaSG13", email = "rafasrrg13@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["agent", "llm", "cli", "claude", "gemini"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=2.3.0",
    "google-genai>=2.34.0",
    "openai>=3.49.0",
    "questionary>=2",
]

[project.urls]
Homepage = "https://github.com/RafaSG13/Minimal"
Repository = "https://github.com/RafaSG13/Minimal"
Issues = "https://github.com/RafaSG13/Minimal/issues"
Marketplace = "https://github.com/RafaSG13/minimal-marketplace"

[project.scripts]
minimal = "minimal.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pillow>=10",
    "mypy>=2.4.1",
    "coverage>=7.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The rule set that was ruff's default at 0.15; newer releases enable many more by default.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.version]
path = "src/minimal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
files = ["src"]

[tool.coverage.run]
source = ["minimal"]
branch = true

[tool.coverage.report]
# One point under the measured total (84.4% at 0.5), so platform differences do not fail CI; raise it as coverage grows.
fail_under = 83
